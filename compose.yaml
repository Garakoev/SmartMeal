services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sms_demo
      POSTGRES_PASSWORD: sms_demo_password
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - sms-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_demo -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  sms-postgres:
